reference:
  - title: "Primary workflow"
    desc: "Start here for routine fit, first-screen results, reports, and exports."
    contents:
      - load_mfrmr_data
      - list_mfrmr_data
      - mfrmr_example_data
      - mfrmr_example_operational_design
      - mfrmr_gtheory_data
      - mfrmr_agreement_data
      - describe_mfrm_data
      - fit_mfrm
      - fit_mfrm_technical_details
      - summary.mfrm_jeffreys_fit
      - mfrm_fit_extractors
      - mfrm_fit_responses
      - confint.mfrm_fit
      - diagnose_mfrm
      - mfrm_results
      - mfrm_report
      - export_mfrm_results
      - mfrmr_output_guide
      - mfrmr_workflow_methods
      - mfrmr_methods_reference

  - title: "Rating design and linking networks"
    desc: "Review who rated what, crossing/nesting and observed linking vulnerabilities. Start with observed ratings or a planned roster; inspect graph links before fitting, then check model identification."
    contents:
      - analyze_hierarchical_structure
      - detect_facet_nesting
      - facet_small_sample_review
      - subset_connectivity_report
      - mfrm_network_analysis
      - build_mfrm_network_review
      - build_peer_review_sim_spec
      - review_peer_design

  - title: "Missing assigned scores"
    desc: "Review response imputations, fit a common MFRM and pool eligible facet targets."
    contents:
      - review_mfrm_imputations
      - fit_mfrm_imputed
      - pool_mfrm_imputed

  - title: "G-theory assessment planning"
    desc: "Separate observed-score variation, project specified future plans, and compare eligible prespecified plans. Start with the G-theory planning article."
    contents:
      - mfrm_g_study
      - confint.mfrm_multivariate_gstudy
      - vcov.mfrm_multivariate_gstudy
      - plot.mfrm_multivariate_gstudy
      - mfrm_d_study
      - summary.mfrm_multivariate_d_study
      - confint.mfrm_multivariate_d_study
      - plot.mfrm_dstudy_intervals
      - plot.mfrm_multivariate_d_study
      - mfrm_multivariate_d_compare
      - mfrm_generalizability
      - mfrm_d_study_main_effects
      - plot.mfrm_d_study

  - title: "Facet and population uncertainty"
    desc: "Review fixed-facet estimates and contrasts, and experimental conditional-normal population intervals, under their respective assumptions."
    contents:
      - mfrm_facet_intervals
      - mfrm_population_intervals

  - title: "Response probabilities and residuals"
    desc: "Describe observed ratings using each supported model's probability definition, without automatic fit cutoffs."
    contents:
      - mfrm_response_diagnostics

  - title: "Shared random raters"
    desc: "Estimate a rater population and distinguish observed-rater feedback from replacement-rater probabilities."
    contents:
      - fit_mfrm_random_rater
      - score_mfrm_random_rater
      - mfrmr_model_maps
      - confint.mfrm_random_rater
      - predict.mfrm_random_rater
      - mfrm_random_rater_intervals

  - title: "Person-specific testlets"
    desc: "Model local dependence within a Person and score conditionally on fitted calibration."
    contents:
      - fit_mfrm_testlet
      - confint.mfrm_testlet
      - predict.mfrm_testlet

  - title: "Person scoring and conditional decisions"
    desc: "Score Persons, report posterior ability-band probabilities, or evaluate future fixed-plan classification accuracy, consistency and conditional precision."
    contents:
      - score_mfrm_persons
      - predict_mfrm_units
      - classification_table
      - sample_mfrm_plausible_values

  - title: "Portable fixed calibration"
    desc: "Create, validate, freeze, persist, and apply eligible RSM/PCM or GPCM MML/JML calibrations; review and export later score batches."
    contents:
      - mfrm_calibration_workflow
      - mfrm_calibration_methods
      - mfrm_calibration_score_methods

  - title: "GPCM slopes and model comparison"
    desc: "Relative-slope intervals, model comparisons, and the scope of GPCM workflows."
    contents:
      - compare_mfrm
      - mfrmr_gpcm_scope
      - bootstrap_mfrm_gpcm
      - mfrm_curve_intervals
