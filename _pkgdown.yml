      - mfrmr_output_guide
      - mfrmr_interval_guide
      - mfrmr_workflow_methods
      - mfrmr_methods_reference

  - title: "External features and exploratory groups"
    desc: "Review entity-level external attributes and describe exploratory groups."
    contents:
      - mfrm_features
      - mfrm_cluster_pam
      - mfrm_cluster_hierarchical
      - mfrm_pca
      - plot.mfrm_pca
      - mfrm_cluster_kmeans
      - mfrm_cluster_imputed
      - mfrm_cluster_compare
      - plot.mfrm_clusters

  - title: "Missing assigned scores"
    desc: "Review response imputations, fit a common MFRM and pool eligible facet targets."
    contents:
      - review_mfrm_imputations
      - fit_mfrm_imputed
      - pool_mfrm_imputed
      - plot.mfrm_pooled

  - title: "G-theory assessment planning"
    desc: "Separate observed-score variation, project specified future plans, and compare eligible prespecified plans. Start with the G-theory planning article."
    contents:
      - mfrm_multivariate_gstudy
      - confint.mfrm_multivariate_gstudy
      - vcov.mfrm_multivariate_gstudy
      - plot.mfrm_multivariate_gstudy
      - mfrm_multivariate_d_study
