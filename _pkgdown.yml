url: https://ryuya-dot-com.github.io/mfrmr/

template:
  bootstrap: 5

development:
  mode: unreleased

redirects:
  - [README.html, index.html]
  - [NEWS.html, news/index.html]

reference:
  - title: "Primary workflow"
    desc: "Start here for routine fit, first-screen results, reports, and exports."
    contents:
      - load_mfrmr_data
      - list_mfrmr_data
      - mfrmr_example_data
      - mfrmr_example_operational_design
      - mfrmr_gtheory_data
      - mfrmr_agreement_data
