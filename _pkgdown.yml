      - plot.mfrm_random_rater
      - mfrm_random_rater_intervals
      - plot.mfrm_random_rater_intervals

  - title: "Person-specific testlets"
    desc: "Model local dependence within a Person and score conditionally on fitted calibration."
    contents:
      - fit_mfrm_testlet
      - confint.mfrm_testlet
      - predict.mfrm_testlet
      - plot.mfrm_testlet
      - plot.mfrm_testlet_scores

  - title: "Person scoring and conditional decisions"
    desc: "Score Persons, report posterior ability-band probabilities, or evaluate future fixed-plan classification accuracy, consistency and conditional precision."
    contents:
      - score_mfrm_persons
      - predict_mfrm_units
      - classification_table
      - summary.mfrm_unit_prediction
      - sample_mfrm_plausible_values

  - title: "Portable fixed calibration"
    desc: "Create, validate, freeze, persist, and apply eligible RSM/PCM or GPCM MML/JML calibrations; review and export later score batches."
    contents:
      - mfrm_calibration_capabilities
      - mfrm_calibration_workflow
      - mfrm_calibration_methods
