      - confint.mfrm_multivariate_d_study
      - plot.mfrm_dstudy_intervals
      - plot.mfrm_multivariate_d_study
      - mfrm_multivariate_d_compare
      - plot.mfrm_multivariate_d_comparison
      - mfrm_generalizability
      - mfrm_d_study
      - plot.mfrm_d_study

  - title: "Facet and population uncertainty"
    desc: "Review fixed-facet estimates and contrasts, and experimental conditional-normal population intervals, under their respective assumptions."
    contents:
      - mfrm_facet_intervals
      - plot.mfrm_facet_intervals
      - mfrm_population_intervals
      - plot.mfrm_population_intervals

  - title: "Response probabilities and residuals"
    desc: "Describe observed ratings using each supported model's probability definition, without automatic fit cutoffs."
    contents:
      - mfrm_response_diagnostics
      - plot.mfrm_response_diagnostics

  - title: "Shared random raters"
    desc: "Estimate a rater population and distinguish observed-rater feedback from replacement-rater probabilities."
    contents:
      - fit_mfrm_random_rater
      - score_mfrm_random_rater
      - mfrmr_model_maps
      - plot.mfrm_random_rater_scores
      - confint.mfrm_random_rater
