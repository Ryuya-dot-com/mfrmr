reference:
  - title: "Measurement: fit and interpret ratings"
    desc: >
      Follow [how the functions connect](../articles/mfrmr.html#how-functions-connect).
      Keep the input and result objects at each step. The measurement route below
      is for ordinary RSM/PCM MML/JML; G-theory planning starts separately from
      observed scores. Other models use their documented output routes.
  - subtitle: "Step 1: Prepare rating data"
    desc: "Input: one row per rating. describe_mfrm_data() returns a design review; pass the rating data itself to fit_mfrm()."
    contents:
      - load_mfrmr_data
      - describe_mfrm_data
  - subtitle: "Step 2: Fit and inspect the model"
    desc: "Keep fit <- fit_mfrm(...). summary(fit) shows tables; it does not replace fit or compute the default diagnostics."
    contents:
      - fit_mfrm
  - subtitle: "Step 3: Diagnose and collect evidence"
    desc: "Keep diagnostics <- diagnose_mfrm(fit), then pass both fit and matching diagnostics to mfrm_results()."
    contents:
      - diagnose_mfrm
      - mfrm_results
  - subtitle: "Step 4: Report and save"
    desc: "Pass collected results to mfrm_report() or export_mfrm_results(). G/D-study and other supported result objects enter mfrm_report() directly."
    contents:
      - mfrm_report
      - export_mfrm_results
  - subtitle: "Extract estimates and uncertainty"
    desc: "Use these with fit when you need individual estimates, covariance, fitted responses or supported intervals. They complement the compact summary."
    contents:
      - mfrm_fit_extractors
      - confint.mfrm_fit
  - subtitle: "Data examples"
    contents:
      - mfrmr_example_data
      - mfrmr_example_operational_design
      - mfrmr_gtheory_data
      - mfrmr_agreement_data
  - subtitle: "Detailed estimation reference"
    desc: "Open the selected model or estimator's section for calculation and inference conditions."
    contents:
      - fit_mfrm_technical_details
  - subtitle: "Workflow and method guides"
    desc: "Choose a question, then follow the relevant analysis route; these are not additional required steps."
    contents:
      - mfrmr_output_guide
      - mfrmr-package
      - mfrmr_methods_reference

  - title: "Rating design and linking networks"
    desc: "Review who rated what, crossing/nesting and observed linking vulnerabilities. Start with observed ratings or a planned roster; inspect graph links before fitting, then check model identification."
    contents:
      - analyze_hierarchical_structure
      - detect_facet_nesting
      - facet_small_sample_review
      - subset_connectivity_report
      - mfrm_network_analysis
      - build_mfrm_network_review
      - build_mfrm_sim_spec
      - review_peer_design

  - title: "Missing assigned scores"
    desc: "Review response imputations, fit a common MFRM and pool eligible facet targets."
    contents:
      - mfrm_response_imputations

  - title: "Assessment planning: G-Study and D-Study"
    desc: "Separate observed-score variation, project specified future plans, and compare eligible prespecified plans. Start with the G-theory planning article."
    contents:
      - mfrm_g_study
      - confint.mfrm_multivariate_gstudy
      - plot.mfrm_multivariate_gstudy
      - mfrm_d_study
      - confint.mfrm_multivariate_d_study
      - plot.mfrm_multivariate_d_study
      - mfrm_d_study_comparison
      - mfrm_generalizability

  - title: "Facet and population uncertainty"
    desc: "Review fixed-facet estimates and contrasts, and experimental conditional-normal population intervals, under their respective assumptions."
    contents:
      - mfrm_facet_intervals
      - mfrm_population_intervals

  - title: "Response probabilities and residuals"
    desc: "Describe observed ratings using each supported model's probability definition, without automatic fit cutoffs."
    contents:
      - mfrm_response_diagnostics

  - title: "Shared random raters"
    desc: "Estimate a rater population and distinguish observed-rater feedback from replacement-rater probabilities."
    contents:
      - fit_mfrm_random_rater
      - score_mfrm_random_rater
      - mfrmr_model_maps
      - mfrm_random_rater_intervals

  - title: "Person-specific testlets"
    desc: "Model local dependence within a Person and score conditionally on fitted calibration."
