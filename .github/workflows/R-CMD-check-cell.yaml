on:
  workflow_call:
    inputs:
      os:
        description: Runner image for the required platform cell.
        required: true
        type: string
      r:
        description: R version selector understood by setup-r.
        required: true
        type: string
      cell-id:
        description: Package-check platform cell identifier.
        required: true
        type: string
      full:
        description: Whether to enable the full NOT_CRAN validation layer.
        required: false
        default: false
        type: boolean
      cran-timing:
        description: Time the complete CRAN workload with manuals and supported optional models.
        required: false
        default: false
        type: boolean
      manual-only:
        description: Isolate indexed manual generation within the Windows timing workflow.
        required: false
        default: false
        type: boolean
      http-user-agent:
        description: Optional setup-r HTTP user agent override.
        required: false
        default: ''
        type: string

jobs:
  check:
    runs-on: ${{ inputs.os }}
    name: ${{ inputs.os }} (${{ inputs.r }})
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ${{ inputs.full && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          http-user-agent: ${{ inputs.http-user-agent }}
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - name: Install XQuartz runtime on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          test -f /opt/X11/lib/libXrender.1.dylib

      - name: Check public source and version metadata
        run: Rscript scripts/check-publication-boundary.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Keep installed dependencies even when a later package check fails.
          cache: always
          # Invalidate compiled-package caches after the runner TBB ABI change.
          cache-version: "2"
          # Source builds avoid Zstandard macOS binaries unsupported by stable pak.
          extra-packages: |
            any::digest
            any::pkgbuild
            any::rcmdcheck
            ${{ inputs.cran-timing && 'any::V8' || '' }}
            any::testthat
            ${{ runner.os == 'macOS' && 'flextable=?source, knitr=?source, xfun=?source' || '' }}
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2
        if: inputs.cran-timing

      - name: Prepare reference-manual LaTeX dependencies
        if: inputs.cran-timing
        run: |
          tlmgr update --self
          tlmgr install inconsolata times helvetic courier fancyvrb microtype makeindex

      - name: Check source package
        id: package-check
        if: ${{ !inputs.manual-only }}
        env:
          MFRMR_CHECK_ERROR_ON: warning
          MFRMR_CHECK_PROFILE: ${{ inputs.cran-timing && 'cran-timing' || 'standard' }}
        run: |
          Rscript --vanilla \
            inst/validation/release-check-runner-0.2.4.R \
            . validation-results/release-check
        shell: bash

      - name: Diagnose Windows numeric-feature process failure
        if: ${{ failure() && runner.os == 'Windows' && steps.package-check.outcome == 'failure' }}
        shell: Rscript {0}
        run: |
          check_root <- "validation-results/release-check/check/mfrmr.Rcheck"
          failed <- file.path(check_root, "tests", "testthat.Rout.fail")
          if (file.exists(failed) && any(grepl(
              "subprocess exited in file 'test-numeric-feature-workflows.R'",
              readLines(failed, warn = FALSE), fixed = TRUE))) {
            .libPaths(c(normalizePath(check_root), .libPaths()))
            # Diagnose the failed file only. TAP records completed assertions;
            # this serial replay does not replace or waive the failed check.
            Sys.setenv(TESTTHAT_PARALLEL = "false")
            testthat::test_dir(file.path(check_root, "tests", "testthat"),
              filter = "^numeric-feature-workflows$", package = "mfrmr",
              load_package = "installed", reporter = "tap")
          }

      - name: Check repository research references against the checked package
        if: ${{ inputs.full && !inputs.cran-timing && steps.package-check.outcome == 'success' }}
        shell: Rscript {0}
        run: |
          checked_library <- normalizePath(
            "validation-results/release-check/check/mfrmr.Rcheck",
            winslash = "/", mustWork = TRUE
          )
          stopifnot(file.exists(file.path(checked_library, "mfrmr", "DESCRIPTION")))
          Sys.setenv(R_LIBS = paste(c(checked_library, .libPaths()),
                                   collapse = .Platform$path.sep))
          status <- system2(file.path(R.home("bin"), "Rscript"), c(
            "--vanilla", "scripts/run-regression.R", ".", "reference",
            "validation-results/release-check/reference"
          ))
          if (status != 0L) quit(status = status)

      - name: Diagnose indexed manuals without repeating the package check
        if: ${{ inputs.cran-timing && inputs.manual-only }}
        shell: Rscript {0}
        run: |
          out <- "validation-results/release-check/manual-diagnostic"
          dir.create(out, recursive = TRUE)
          out <- normalizePath(out, winslash = "/")
          writeLines(capture.output(list(
            Commit = Sys.getenv("GITHUB_SHA"), Session = sessionInfo(),
            Tools = Sys.which(c("texi2dvi", "texify", "makeindex", "pdflatex")),
            DefaultTexi2dvi = getOption("texi2dvi")
          )), file.path(out, "environment.txt"))
          stopifnot(nzchar(Sys.which("makeindex")))
          build <- file.path(out, "default")
          dir.create(build)
          pdf <- file.path(out, "default.pdf")
          log <- file.path(out, "default.log")
          started <- proc.time()[["elapsed"]]
          status <- system2(file.path(R.home("bin"), "Rcmd.exe"),
            c("Rd2pdf", "--no-preview", "--no-clean", "--force",
              shQuote(paste0("--build-dir=", build)),
              shQuote(paste0("--output=", pdf)), "."),
            stdout = log, stderr = log)
          results <- data.frame(Mode = "default", Status = status,
            PDFExists = file.exists(pdf), IndexExists = file.exists(file.path(build, "Rd2.ind")),
            Elapsed = proc.time()[["elapsed"]] - started)
          write.csv(results, file.path(out, "results.csv"), row.names = FALSE)
          print(results)
          stopifnot(results$Status == 0, results$PDFExists, results$IndexExists)

      - name: International input and moved-folder replay
        if: ${{ !inputs.cran-timing }}
        run: |
          check_root <- "validation-results/release-check"
          checked_library <- file.path(check_root, "check", "mfrmr.Rcheck")
          .libPaths(c(normalizePath(checked_library), .libPaths()))
          library(mfrmr)
          source("inst/validation/user-data-stress-0.2.4.R")
          output <- file.path(check_root, "portability")
          inputs <- run_user_data_stress(
            file.path(output, "inputs"), seeds = 20260913L,
            only = c("nonstandard_columns", "unicode_long_labels")
          )
          archives <- run_user_data_archive_stress(
            file.path(output, "archives"), library = checked_library
          )
          stopifnot(nrow(inputs) == 2L, all(inputs$Passed),
                    nrow(archives) == 8L, all(archives$Passed))
        shell: Rscript {0}

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-${{ inputs.cell-id }}
          path: |
            validation-results/release-check/*.tar.gz
            validation-results/release-check/check
            validation-results/release-check/release-check-receipt.rds
            validation-results/release-check/check-timing.rds
            validation-results/release-check/check-timing.csv
            validation-results/release-check/check-phases.csv
            validation-results/release-check/dependency-versions.csv
            validation-results/release-check/session-info.txt
            validation-results/release-check/portability
            validation-results/release-check/reference
            validation-results/release-check/manual-diagnostic
          if-no-files-found: ignore

      - name: Verify retained package-check results
        if: ${{ !inputs.manual-only }}
        shell: Rscript {0}
        run: |
          root <- "validation-results/release-check"
          receipt <- readRDS(file.path(root, "release-check-receipt.rds"))
          tarball <- list.files(root, pattern = "^mfrmr_[0-9.]+[.]tar[.]gz$",
                                full.names = TRUE)
          log <- file.path(root, "check", "mfrmr.Rcheck", "00check.log")
          stopifnot(length(tarball) == 1L, file.exists(log),
                    isTRUE(receipt$CheckComplete),
                    identical(receipt$Errors, 0L), identical(receipt$Warnings, 0L),
                    identical(receipt$CandidateGitCommit, Sys.getenv("GITHUB_SHA")),
                    identical(receipt$PackageVersion, unname(read.dcf("DESCRIPTION")[1, "Version"])),
                    identical(receipt$SourceTarballSHA256,
                              digest::digest(file = tarball, algo = "sha256", serialize = FALSE)),
                    identical(receipt$CheckLogSHA256,
                              digest::digest(file = log, algo = "sha256", serialize = FALSE)))
          cat("Checked source, log and receipt agree.\n")
