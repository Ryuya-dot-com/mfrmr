on:
  workflow_call:
    inputs:
      os:
        description: Runner image for the required platform cell.
        required: true
        type: string
      r:
        description: R version selector understood by setup-r.
        required: true
        type: string
      cell-id:
        description: Frozen fixed-calibration G4 platform cell identifier.
        required: true
        type: string
      full:
        description: Whether to enable the full NOT_CRAN validation layer.
        required: false
        default: false
        type: boolean
      http-user-agent:
        description: Optional setup-r HTTP user agent override.
        required: false
        default: ''
        type: string

jobs:
  check:
    runs-on: ${{ inputs.os }}
    name: ${{ inputs.os }} (${{ inputs.r }})

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ${{ inputs.full && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          http-user-agent: ${{ inputs.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Invalidate compiled-package caches after the runner TBB ABI change.
          cache-version: "2"
          extra-packages: any::digest, any::pkgbuild, any::rcmdcheck, any::testthat
          needs: check

      - name: Exact bound-tarball R CMD check and G4 evidence
        env:
          MFRMR_G4_CELL_ID: ${{ inputs.cell-id }}
          MFRMR_G4_R_SELECTOR: ${{ inputs.r }}
          MFRMR_CHECK_ERROR_ON: warning
        run: |
          Rscript --vanilla \
            inst/validation/fixed-calibration-g4-hosted-runner-0.2.4.R \
            cell . validation-results/g4-hosted
        shell: bash

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-${{ inputs.cell-id }}
          path: |
            validation-results/g4-hosted/check
            validation-results/g4-hosted/worker.log
          if-no-files-found: ignore

      - name: Upload bound G4 cell receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-evidence-${{ inputs.cell-id }}
          path: validation-results/g4-hosted/hosted-cell-receipt.rds
          if-no-files-found: ignore

      - name: Repository validation review
        run: |
          source("inst/validation/release-readiness.R")
          tarball <- list.files(
            "validation-results/g4-hosted",
            pattern = "^mfrmr_[0-9.]+[.]tar[.]gz$", full.names = TRUE
          )
          if (length(tarball) != 1L) {
            stop("The bound G4 source tarball is unavailable.", call. = FALSE)
          }
          readiness <- mfrmr_release_readiness_review(
            pkg_dir = ".",
            check_log = file.path(
              "validation-results/g4-hosted/check/mfrmr.Rcheck/00check.log"
            ),
            tarball = tarball
          )
          print(summary(readiness))
          if (any(readiness$gate_summary$Status == "concern", na.rm = TRUE)) {
            stop("Repository validation review has concern rows.", call. = FALSE)
          }
        shell: Rscript {0}
