# Manually dispatched successor evidence. Routine pushes use R-CMD-check.yaml
# and cannot issue G4 receipts.
on:
  workflow_dispatch:

name: Fixed-calibration G4 v6

permissions:
  contents: read

jobs:
  macos-release:
    name: macos-latest (release) v6 prerequisite
    uses: ./.github/workflows/fixed-calibration-g4-v6-cell.yaml
    with:
      os: macos-latest
      r: release
      cell-id: macos-release
      full: false

  remaining-platforms:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    needs: macos-release
    strategy:
      fail-fast: false
      matrix:
        config:
          - {id: windows-release,  os: windows-latest, r: 'release',  full: false}
          - {id: ubuntu-devel,     os: ubuntu-latest,  r: 'devel',    full: false, http-user-agent: 'release'}
          - {id: ubuntu-release,   os: ubuntu-latest,  r: 'release',  full: true}
          - {id: ubuntu-oldrel-1,  os: ubuntu-latest,  r: 'oldrel-1', full: false}
    uses: ./.github/workflows/fixed-calibration-g4-v6-cell.yaml
    with:
      os: ${{ matrix.config.os }}
      r: ${{ matrix.config.r }}
      cell-id: ${{ matrix.config.id }}
      full: ${{ matrix.config.full }}
      http-user-agent: ${{ matrix.config['http-user-agent'] || '' }}

  g4-v6-hosted-matrix:
    name: Aggregate post-maintenance fixed-calibration G4 v6 matrix
    needs: [macos-release, remaining-platforms]
    runs-on: ubuntu-latest
    env:
      MFRMR_G4_CONTRACT_GENERATION: v6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::digest

      - uses: actions/download-artifact@v4
        with:
          pattern: g4-v6-evidence-*
          path: validation-results/g4-v6-downloads

      - name: Aggregate five bound G4 v6 receipts
        run: |
          Rscript --vanilla \
            inst/validation/fixed-calibration-g4-hosted-runner-0.2.4.R \
            aggregate . validation-results/g4-v6-downloads \
            validation-results/g4-v6-hosted-matrix.rds
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: g4-v6-hosted-matrix
          path: validation-results/g4-v6-hosted-matrix.rds
          if-no-files-found: error
