# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# macOS runs the CRAN selection first; Ubuntu release then runs all package
# tests with NOT_CRAN=true. Other cells retain the CRAN selection.
on:
  push:
    branches: [main, master, 'dev/**', 'development/**']
  pull_request:
  workflow_dispatch:
    inputs:
      windows_timing:
        description: Windows-only CRAN timing including manuals
        type: boolean
        required: false
        default: false
      manual_only:
        description: With windows_timing, diagnose indexed manuals without rebuilding or checking the package
        type: boolean
        required: false
        default: false

name: R-CMD-check

permissions:
  contents: read

jobs:
  macos-release:
    if: ${{ !inputs.windows_timing }}
    name: macos-latest (release) prerequisite
    uses: ./.github/workflows/R-CMD-check-cell.yaml
    with:
      os: macos-latest
      r: release
      cell-id: macos-release
      full: false

  remaining-platforms:
    if: ${{ !inputs.windows_timing }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    needs: macos-release
    strategy:
      fail-fast: false
      matrix:
        config:
          - {id: windows-release,  os: windows-latest, r: 'release'}
          - {id: ubuntu-devel,     os: ubuntu-latest,  r: 'devel',   http-user-agent: 'release'}
          - {id: ubuntu-release,   os: ubuntu-latest,  r: 'release'}
          - {id: ubuntu-oldrel-1,  os: ubuntu-latest,  r: 'oldrel-1'}
    uses: ./.github/workflows/R-CMD-check-cell.yaml
    with:
      os: ${{ matrix.config.os }}
      r: ${{ matrix.config.r }}
      cell-id: ${{ matrix.config.id }}
      full: ${{ matrix.config.id == 'ubuntu-release' }}
      http-user-agent: ${{ matrix.config['http-user-agent'] || '' }}

  windows-cran-timing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_timing }}
    name: ${{ inputs.manual_only && 'Windows manual diagnosis' || 'Windows complete CRAN timing' }}
    uses: ./.github/workflows/R-CMD-check-cell.yaml
    with:
      os: windows-latest
      r: release
      cell-id: windows-cran-timing
      cran-timing: true
      manual-only: ${{ inputs.manual_only }}
