# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Runs the macOS/R-release cell first on every push and pull request. The
# remaining Windows/Linux R-version cells start only after that prerequisite
# succeeds. Fixed-calibration G4 receipt issuance is held until the
# post-maintenance successor contract is frozen. Isolated G-theory
# execution/resume validation remains an explicit slow tier and is not a
# release check unless MFRMR_RUN_GTHEORY_SLOW is set by a dedicated run.
on:
  push:
    branches: [main, master, 'dev/**', 'development/**']
  pull_request:

name: R-CMD-check

permissions:
  contents: read

jobs:
  macos-release:
    name: macos-latest (release) prerequisite
    uses: ./.github/workflows/R-CMD-check-cell.yaml
    with:
      os: macos-latest
      r: release
      cell-id: macos-release
      full: false

  remaining-platforms:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    needs: macos-release
    strategy:
      fail-fast: false
      matrix:
        config:
          - {id: windows-release,  os: windows-latest, r: 'release',  full: false}
          - {id: ubuntu-devel,     os: ubuntu-latest,  r: 'devel',    full: false, http-user-agent: 'release'}
          - {id: ubuntu-release,   os: ubuntu-latest,  r: 'release',  full: true}
          - {id: ubuntu-oldrel-1,  os: ubuntu-latest,  r: 'oldrel-1', full: false}
    uses: ./.github/workflows/R-CMD-check-cell.yaml
    with:
      os: ${{ matrix.config.os }}
      r: ${{ matrix.config.r }}
      cell-id: ${{ matrix.config.id }}
      full: ${{ matrix.config.full }}
      http-user-agent: ${{ matrix.config['http-user-agent'] || '' }}
