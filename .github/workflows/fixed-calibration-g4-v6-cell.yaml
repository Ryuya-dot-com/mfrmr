on:
  workflow_call:
    inputs:
      os:
        description: Runner image for the frozen v6 platform cell.
        required: true
        type: string
      r:
        description: R version selector understood by setup-r.
        required: true
        type: string
      cell-id:
        description: Frozen post-maintenance G4 v6 cell identifier.
        required: true
        type: string
      full:
        description: Whether to enable the full NOT_CRAN validation layer.
        required: false
        default: false
        type: boolean
      http-user-agent:
        description: Optional setup-r HTTP user agent override.
        required: false
        default: ''
        type: string

jobs:
  check:
    runs-on: ${{ inputs.os }}
    name: ${{ inputs.os }} (${{ inputs.r }})

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ${{ inputs.full && 'true' || 'false' }}
      MFRMR_G4_CONTRACT_GENERATION: v6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          http-user-agent: ${{ inputs.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: "2"
          extra-packages: any::digest, any::pkgbuild, any::rcmdcheck, any::testthat
          needs: check

      - name: Exact bound-tarball check and post-maintenance G4 v6 evidence
        env:
          MFRMR_G4_CELL_ID: ${{ inputs.cell-id }}
          MFRMR_G4_R_SELECTOR: ${{ inputs.r }}
          MFRMR_CHECK_ERROR_ON: warning
        run: |
          Rscript --vanilla \
            inst/validation/fixed-calibration-g4-hosted-runner-0.2.4.R \
            cell . validation-results/g4-v6-hosted
        shell: bash

      - name: Upload v6 check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-v6-check-${{ inputs.cell-id }}
          path: |
            validation-results/g4-v6-hosted/check
            validation-results/g4-v6-hosted/worker.log
          if-no-files-found: ignore

      - name: Upload bound G4 v6 cell receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-v6-evidence-${{ inputs.cell-id }}
          path: validation-results/g4-v6-hosted/hosted-cell-receipt.rds
          if-no-files-found: ignore

      - name: Repository validation review
        run: |
          source("inst/validation/release-readiness.R")
          hosted <- new.env(parent = globalenv())
          sys.source(
            "inst/validation/fixed-calibration-g4-hosted-runner-0.2.4.R",
            envir = hosted
          )
          tarball <- list.files(
            "validation-results/g4-v6-hosted",
            pattern = "^mfrmr_[0-9.]+[.]tar[.]gz$", full.names = TRUE
          )
          if (length(tarball) != 1L) {
            stop("The bound G4 v6 source tarball is unavailable.",
                 call. = FALSE)
          }
          readiness <- mfrmr_release_readiness_review(
            pkg_dir = ".",
            check_log = file.path(
              "validation-results/g4-v6-hosted/check/",
              "mfrmr.Rcheck/00check.log"
            ),
            tarball = tarball
          )
          print(summary(readiness))
          context <- hosted$mfrmr_fc_g4h_context(".")
          stopifnot(identical(context$Generation, "v6"))
          g4_review <- hosted$mfrmr_fc_g4h_repository_review(
            context, readiness
          )
          print(g4_review$RequiredGates, row.names = FALSE)
          cat(
            "Hosted post-maintenance G4 v6 repository scope complete; ",
            "G6 and public API remain unauthorized.\n",
            sep = ""
          )
        shell: Rscript {0}
